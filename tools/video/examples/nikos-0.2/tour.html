html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

<script>
// ── Time helpers (from the starter) ─────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const span = (t, s, d) => clamp((t - s) / d);
const bezier = (x1, y1, x2, y2) => (x) => {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  let u = x;
  for (let i = 0; i < 8; i++) {
    const bx = 3 * x1 * u * (1 - u) ** 2 + 3 * x2 * u * u * (1 - u) + u ** 3 - x;
    const dx = 3 * x1 * (1 - u) ** 2 + 6 * (x2 - x1) * u * (1 - u) + 3 * (1 - x2) * u * u;
    if (Math.abs(dx) < 1e-6) break;
    u = clamp(u - bx / dx);
  }
  return 3 * y1 * u * (1 - u) ** 2 + 3 * y2 * u * u * (1 - u) + u ** 3;
};
const std = bezier(0.4, 0, 0.2, 1);
const dec = bezier(0, 0, 0.2, 1);
const back = (x) => { x = clamp(x); const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; };
const $ = (id) => document.getElementById(id);
const put = (n, s) => Object.assign(n.style, s);
const typeOut = (text, t, from, dur) => text.slice(0, Math.round(text.length * clamp((t - from) / dur)));
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
// Visible from a to b, fading in and out.
const vis = (t, a, b = 1e9, fi = 0.5, fo = 0.5) => Math.min(span(t, a, fi), 1 - span(t, b - fo, fo));
// Keyframes [t, ...values], eased between.
const along = (K, t) => {
  if (t <= K[0][0]) return K[0].slice(1);
  for (let i = 0; i < K.length - 1; i++) { const [t0, ...a] = K[i], [t1, ...b] = K[i + 1]; if (t < t1) { const p = std(span(t, t0, t1 - t0)); return a.map((v, j) => lerp(v, b[j], p)); } }
  return K[K.length - 1].slice(1);
};
const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return $("stage").appendChild(d.firstChild); };

// ── The timeline: where each voiceover section starts ───────────────────
// vo/s1.mp3 … vo/s8.mp3, laid at these seconds by voice.mjs; times below are those offsets
// plus the word timings of each clip.
const O = [0.6, 15.2, 34.4, 59.2, 75.4, 91.0, 105.6, 122.5];
const at = (s, x) => O[s - 1] + x;
const END = at(8, 14.4); // "Start with nikOS."
window.TOTAL = 144.5;
window.VO = O.map((x, i) => [`vo/s${i + 1}.mp3`, x]);

const KICK = [
  [0.4, "01", "Your company. Your plan. Your repo."], [at(2, -0.2), "02", "Start with the outcome"],
  [at(3, -0.2), "03", "Follow the goal into the work"], [at(4, -0.2), "04", "Turn intent into something buildable"],
  [at(5, -0.2), "05", "Give “done” some evidence"], [at(6, -0.2), "06", "Keep the connection as teams move"],
  [at(7, -0.2), "07", "Start with what you already have"], [at(8, -0.2), "08", "Close the distance"],
];
// Captions: the voiceover, as said.
const CAPS = [
  [1, 0, 2.6, "Your company’s goals live in a deck."], [1, 2.8, 4.3, "Delivery lives in tickets."], [1, 4.4, 6.8, "Agents work from whatever context they’re given."],
  [1, 6.9, 8.6, "What if those things were connected?"], [1, 8.7, 9.7, "Meet nikOS."], [1, 9.7, 13.9, "Your company plan lives in a repository, right beside the work that delivers it."],
  [2, 0, 2.9, "Start with your objectives and key results."], [2, 3.0, 4.6, "What are we trying to achieve?"], [2, 4.7, 5.6, "Who owns it?"],
  [2, 5.7, 7.5, "How will we measure progress?"], [2, 8.0, 9.6, "Ask your agent to add one,"], [2, 9.7, 11.6, "and it arrives as a pull request:"],
  [2, 11.7, 14.6, "reviewed and merged, like any other change."], [2, 14.8, 18.2, "Then connect the departments and teams contributing to that outcome."],
  [3, 0, 4.9, "For the Payments department, that means getting more groups paying together."], [3, 5.0, 8.6, "It sets its own key result, aligned to the company’s."],
  [3, 8.7, 12.9, "The Tip Calc team connects its measure: bills split per week."], [3, 13.0, 18.8, "Then it places a bet: what it believes will move that number, and when it will review it."],
  [3, 18.9, 21.4, "Map the stories that deliver the bet."], [3, 21.5, 24.1, "Now everyone can see why the work matters."],
  [4, 0, 3.0, "Before your agents build, define the intent."], [4, 3.1, 4.3, "Who is this for?"], [4, 4.3, 5.7, "What should happen?"], [4, 5.7, 7.4, "What does success look like?"],
  [4, 7.5, 12.1, "Turn those answers into concrete examples and executable specifications."], [4, 12.2, 15.5, "A shared agreement, not a vague handover."],
  [5, 0, 3.1, "Agents build from the specification."], [5, 3.2, 4.7, "Tests check the behaviour."], [5, 4.7, 8.2, "Pending tests? Not done."],
  [5, 8.3, 10.3, "Human approval stays separate."], [5, 10.3, 14.9, "Change the specification, and the old approval no longer holds."],
  [6, 0, 7.5, "Teams keep their stories and specifications in their own repositories, connected to their department and the company plan."],
  [6, 7.6, 9.0, "Work in parallel."], [6, 9.1, 12.0, "Review each bet’s delivery alongside goal progress."], [6, 12.1, 13.9, "See when plans need syncing."],
  [7, 0, 5.3, "nikOS is open source, and it runs in the repositories you already use."], [7, 5.9, 9.0, "Start with one team, with nothing new to buy."],
  [7, 9.6, 12.4, "Then shape the tool itself to fit how your company works."], [7, 13.0, 15.9, "Your own views of the plan, at your own address."],
  [8, 0, 4.9, "From company direction to department goals and team bets."], [8, 5.0, 8.9, "From intent to specifications your agents can build from."],
  [8, 9.0, 14.2, "Your plans. Your repositories. Your way of working."],
].map(([s, a, b, x]) => [at(s, a), at(s, b), x]);

// ── 1. Three things that don't talk to each other ───────────────────────
const TILES = [
  [el(`<div class="tile" style="background:#FFF;border:1px solid var(--line)"><div class="k">Q1 plan.pptx · slide 3</div>
    <div style="font:700 40px 'Schibsted Grotesk';margin-top:26px;letter-spacing:-.01em">Grow revenue</div>

    <div class="mono" style="margin-top:24px;font-size:20px;color:var(--you);border-left:2px solid var(--glyph);padding:8px 12px;background:rgba(255,255,255,.06)"><span style="color:var(--glyph)">›</span> <span id="agtyped"></span></div>

const BRAND = el(`<div class="abs" style="left:0;right:0;top:400px;text-align:center"><div style="display:inline-flex;align-items:center;gap:30px">

  <span style="font:700 132px 'Schibsted Grotesk';letter-spacing:-.03em">nikOS</span></div></div>`);

// ── Real screens ─────────────────────────────────────────────────────────
const WIN = { left: 240, top: 120, w: 1440, h: 800 };
const makeShot = (src, W, H, title) => {
  const node = el(`<div class="win" style="left:${WIN.left}px;top:${WIN.top}px;width:${WIN.w}px;height:${WIN.h}px">

// The planning dashboards (nikos planning serve) at each level, and the team's story map
// (nikos map), as captured from the run in script.md. Dashboards are 2× captures of a 1440×800 page.
const DASH = (repo) => `<b>${repo}</b> · nikos planning serve`;
const CKR = makeShot("shots/company-krs.png", 2880, 1600, DASH("acme/company-plan"));
const CROLL = makeShot("shots/company-rollout.png", 2880, 1600, DASH("acme/company-plan"));

const TKR = makeShot("shots/team-krs.png", 2880, 1600, DASH("acme/tip-calc"));
const BETS = makeShot("shots/team-bets.png", 2880, 1600, DASH("acme/tip-calc"));

const MAP = makeShot("shots/storymap.png", 1640, 880, "<b>acme/tip-calc</b> · nikos map");
// A key result card, close up: the same framing on every level's dashboard.
const KRZ = [2.2, 1000, 415];

    put(node, { left: `${x - 200}px`, top: `${y - 125}px`, opacity: o, transform: `scale(${lerp(1, 0.55, gather)})`, visibility: o > 0 ? "visible" : "hidden" });
  });
  $("agtyped").textContent = typeOut("Build bill splitting", t, at(1, 4.6), 0.9);
  const link = span(t, at(1, 6.9), 0.9);
  if (t < at(1, 9.4)) {
    const o = 1 - span(t, at(1, 8.6), 0.4);
    svg += path("M622 470 L758 470", span(t, at(1, 1.6), 0.4), o * (1 - link), true) + path("M1162 470 L1298 470", span(t, at(1, 4.6), 0.4), o * (1 - link), true);
    svg += path("M622 470 L752 470", span(t, at(1, 6.9), 0.6), o) + path("M1162 470 L1292 470", span(t, at(1, 7.3), 0.6), o);
  }
  const bo = vis(t, at(1, 8.9), at(1, 10.4), 0.4, 0.5);
  put(BRAND, { opacity: bo, transform: `scale(${lerp(0.92, 1, back(span(t, at(1, 8.9), 0.5)))})`, visibility: bo > 0 ? "visible" : "hidden" });

  // Real screens: each fades in, zooms, and spotlights what the voice names.
  for (const { s, vis: [a, b], rise, zoom, spots } of SHOTS) {
    const o = vis(t, a, b, 0.6, 0.6);
    put(s.node, { opacity: o, visibility: o > 0 ? "visible" : "hidden", transform: rise ? `translateY(${lerp(140, 0, dec(span(t, rise, 0.9)))}px)` : "none" });
    if (o <= 0) continue;
    const g = geom(s, ...along(zoom, t));
    s.g = g;
    put(s.img, { transform: `translate(${g.tx}px, ${g.ty}px) scale(${g.s})` });
    const i = spots.findIndex(([a2, b2]) => t >= a2 && t < b2);
    if (i < 0) { put(s.spot, { opacity: 0 }); continue; }
    let [a2, b2, x, y, w, h] = spots[i];
    const prev = spots[i - 1];
    if (prev && prev[1] >= a2 - 0.01) { const p = std(span(t, a2, 0.4)); [x, y, w, h] = [x, y, w, h].map((v, j) => lerp(prev[j + 2], v, p)); }
    const so = prev && prev[1] >= a2 - 0.01 ? 1 - span(t, b2 - 0.3, 0.3) : vis(t, a2, b2, 0.3, 0.3);
    put(s.spot, { opacity: so, left: `${g.tx + x * g.s - 6}px`, top: `${g.ty + y * g.s - 6}px`, width: `${w * g.s + 12}px`, height: `${h * g.s + 12}px` });
  }

  // 2. Callouts on the key result.
  let calls = "";
  if (CKR.g && t > at(2, 2.8) && t < at(2, 7.8)) {
    [[at(2, 3.0), at(2, 4.6), 305, "Objective", "What we want to achieve"], [at(2, 4.7), at(2, 5.6), 347, "Owner · deadline", "The Board, by 31 March 2027"],
      [at(2, 5.7), at(2, 7.5), 455, "Key result", "Baseline 1 → target 2"]].forEach(([a, b, y, sm, text]) => {
      const o = vis(t, a, b, 0.3, 0.3); if (o <= 0) return;
      const [, sy] = toStage(CKR.g, 0, y), [sx] = toStage(CKR.g, 1120, 0);
      calls += `<div class="call" style="left:${sx + 30}px;top:${sy - 30}px;opacity:${o}"><small>${sm}</small>${text}</div>`;
    });
  }

  // 2–3. The company KR, linked to the departments and teams below it, then down the chain to a story.
  const g2 = CROLL.g;
  const [gx, gy] = along([[at(3, 0.1), 960, 236], [at(3, 0.9), CHAIN_X, CHAIN_Y(0)]], t);
  CHAIN.forEach(([node, from], i) => {
    const o = i === 0 ? vis(t, at(2, 14.9), at(4, 0.6), 0.5, 0.6) : vis(t, from, at(4, 0.6), 0.4, 0.6);
    const [x, y] = i === 0 ? [gx, gy] : [CHAIN_X, CHAIN_Y(i)];
    chipAt(node, x, y, o, t > at(3, 21.5) && t < at(4, 0.4), i === 0 ? 1 : lerp(0.9, 1, back(span(t, from, 0.4))));
    if (i > 0 && t < at(4, 0.6)) svg += path(`M${CHAIN_X} ${CHAIN_Y(i - 1) + 38} L${CHAIN_X} ${CHAIN_Y(i) - 42}`, span(t, from - 0.1, 0.35), 1 - span(t, at(4, 0), 0.5));
  });
  if (g2 && t < at(3, 0.4)) {
    // Departments below the company, and the team below its department.
    const lo = 1 - span(t, at(3, 0), 0.4);
    [[801, at(2, 15.2)], [1420, at(2, 15.6)]].forEach(([ix, from]) => {
      const [cx, cy] = toStage(g2, ix, 249);
      svg += path(`M960 272 C960 ${cy - 40} ${cx} 300 ${cx} ${cy - 8}`, span(t, from, 0.6), lo);
    });
    const [px, py] = toStage(g2, 801, 825), [tx2, ty2] = toStage(g2, 2038, 825);
    svg += path(`M${px} ${py + 8} C${px} ${py + 70} ${tx2} ${ty2 + 70} ${tx2} ${ty2 + 12}`, span(t, at(2, 16.0), 0.7), lo);
  }
  if (CROLL.g && t > at(2, 16.4) && t < at(2, 18.2)) {
    const o = vis(t, at(2, 16.5), at(2, 18.2), 0.3, 0.3), [lx, ly] = toStage(g2, 1420, 825);
    calls += `<div class="call" style="left:${lx - 150}px;top:${ly + 70}px;opacity:${o}"><small>Department → team</small>Tip Calc plans below Payments</div>`;
  }
  if (MAP.g && t > at(3, 19.6) && t < at(4, 0.6)) {
    const [mx, my] = toStage(MAP.g, 528, 643);
    svg += path(`M${CHAIN_X - 172} ${CHAIN_Y(4)} C${CHAIN_X - 260} ${CHAIN_Y(4)} ${mx + 80} ${my} ${mx + 12} ${my}`, span(t, at(3, 20.7), 0.5), 1 - span(t, at(4, 0), 0.5));
  }
  if (BETS.g) {
    [[at(3, 13.5), at(3, 16.8), "Hypothesis", "What we believe will move it"], [at(3, 16.8), at(3, 18.9), "Review date", "When we decide: continue, change or stop"]].forEach(([a, b, sm, text], i) => {
      const o = vis(t, a, b, 0.3, 0.3); if (o <= 0) return;
      calls += `<div class="call" style="left:300px;top:${i ? 760 : 780}px;opacity:${o}"><small>${sm}</small>${text}</div>`;
    });
  }

  // 4–5. Editor: the spec types in, then marks red, green, and changed.
  const edO = vis(t, at(4, 0.2), at(6, 0.3), 0.6, 0.5);
  put(ED, { opacity: edO, visibility: edO > 0 ? "visible" : "hidden", transform: `translateY(${lerp(60, 0, dec(span(t, at(4, 0.2), 0.8)))}px)` });
  if (edO > 0) {
    $("code").innerHTML = FEAT.map(([html, from, typed], i) => {
      if (!from || t < from) return `<div class="ln"><span class="n">${i + 1}</span><span class="x"> </span></div>`;
      let x = typed ? esc(typeOut(html, t, from, 0.6)) : html;
      if (i === EDIT.line && t >= EDIT.from) x += `<span style="color:var(--warn);font-weight:600">${esc(typeOut(EDIT.text, t, EDIT.from + 0.2, 0.6))}</span>`;
      const m = MARKS.filter(([l, a, b]) => l === i && t >= a && t < b).pop();
      const tick = m && (m[3] === "bad" || m[3] === "good") ? `  <span style="color:${m[3] === "good" ? "var(--accent)" : "#D64545"};font-weight:700">${m[3] === "good" ? "✓" : "✗"}</span>` : "";
      return `<div class="ln${m ? ` ${m[3]}` : ""}"><span class="n">${i + 1}</span><span class="x">${x}${tick}</span></div>`;
    }).join("");
    EDCALL.forEach(([l, a, b, text]) => {
      const o = vis(t, a, b, 0.3, 0.4); if (o <= 0) return;
      calls += `<div class="call" style="left:${150 + 900 + lerp(20, 0, dec(span(t, a, 0.4)))}px;top:${160 + 56 + l * 31 - 6}px;opacity:${o * edO}">${text}</div>`;
    });
    const so = vis(t, at(4, 12.2), at(4, 15.6), 0.3, 0.4);
    if (so > 0) calls += `<div class="call" style="left:1070px;top:860px;opacity:${so}"><small>One file in the repo</small>Read by people. Run as tests.</div>`;
    const ao = vis(t, at(5, 8.4), at(5, 10.3), 0.3, 0.4);
    if (ao > 0) calls += `<div class="call" style="left:1070px;top:860px;opacity:${ao}"><small>Approval</small>A person approves, not the agent</div>`;
  }

  // 2. The pull request: open, checked, reviewed, merged.
  const prO = vis(t, at(2, 10.9), at(2, 14.8), 0.5, 0.5);
  put(PR, { opacity: prO, visibility: prO > 0 ? "visible" : "hidden", transform: `translateY(${lerp(40, 0, dec(span(t, at(2, 10.9), 0.7)))}px)` });
  if (prO > 0) {
    const merged = t >= at(2, 12.4);
    $("prst").textContent = merged ? "Merged" : "Open";
    put($("prst"), { background: merged ? "#6E40C9" : "var(--accent)" });
    put($("prchk"), { opacity: span(t, at(2, 11.2), 0.3) });
    put($("prrev"), { opacity: span(t, at(2, 11.7), 0.3) });
  }

  // Agent terminal: everything that has started and not been cleared, newest at the bottom.
  const twO = Math.max(vis(t, at(2, 7.5), at(2, 14.8), 0.5, 0.5), vis(t, at(4, 10.2), at(6, 0.3), 0.5, 0.5), vis(t, at(6, 8.7), at(7, 0), 0.5, 0.5));
  put(TW, { opacity: twO, visibility: twO > 0 ? "visible" : "hidden" });
  if (twO > 0) {
    const live = TERM.filter((e) => t >= e[1] && t < e[2]);
    const typing = live.find((e) => e[0] === "you" && t < e[1] + typedFor(e) + 0.25);
    const cwd = [...live].reverse().find((e) => e[5]);
    $("twcwd").textContent = `· ${cwd ? cwd[5] : "tip-calc"}`;
    $("term").innerHTML = live.map((e) => {
      const [kind, from, , text, hl] = e;
      if (kind === "you") return `<div class="l you"><b>›</b>${esc(typeOut(text, t, from, typedFor(e)))}${e === typing ? `<span id="tcaret"></span>` : ""}</div>`;
      if (kind === "ag") { const w = text.split(" "); return `<div class="l ag">${esc(w.slice(0, Math.ceil(w.length * span(t, from, Math.max(0.4, w.length / 14)))).join(" "))}</div>`; }
      if (kind === "cmd") return `<div class="l cmd"><b>$</b> ${esc(text)}</div>`;
      const h = (hl || []).filter(([a]) => t >= a).pop();
      return `<div class="l out${h ? ` ${h[1]}` : ""}">${text || " "}</div>`;
    }).join("");
  }

  // 6. Per-story files, two branches, one merge; the team repo joined to its department and the company.
  const fO = vis(t, at(6, 0.2), at(7, 0.2), 0.5, 0.5);
  FILES.forEach((f) => {
    const o = fO * span(t, at(6, 0.3) + f.i * 0.25, 0.4);
    put(f.node, { opacity: o, visibility: o > 0 ? "visible" : "hidden", transform: `translateY(${lerp(30, 0, dec(span(t, at(6, 0.3) + f.i * 0.25, 0.5)))}px)` });
    if (o <= 0) return;
    const moved = f.br && t >= at(6, f.br === "a" ? 7.8 : 8.2);
    f.node.querySelector(".body").innerHTML = moved ? yk(esc(f.after)).replace("in_progress", `<span class="hv">in_progress</span>`) : yk(esc(f.body));
    put(f.node.querySelector(".tag"), { opacity: f.br ? span(t, at(6, f.br === "a" ? 7.6 : 8.0), 0.3) : 0 });
  });
  const rcO = vis(t, at(6, 0.3), at(6, 8.8), 0.4, 0.4);
  REPOS.forEach(([n, x, from], i) => {
    chipAt(n, x, 205, rcO * span(t, from, 0.4));
    if (i > 0) svg += path(`M${REPOS[i - 1][1] + 150} 205 L${x - 150} 205`, span(t, from - 0.2, 0.4), rcO);
  });
  put(MERGED, { left: "150px", top: "750px", opacity: fO * vis(t, at(6, 8.5), at(7, 0.2), 0.4, 0.5), visibility: fO > 0 ? "visible" : "hidden" });

  // 7. The real files, labelled.
  const tO = vis(t, at(7, 1.8), at(7, 12.9), 0.5, 0.5);
  [T1, T2].forEach((n, i) => {
    const o = tO * span(t, at(7, 1.9) + i * 0.3, 0.4);
    put(n, { opacity: o, visibility: o > 0 ? "visible" : "hidden" });
    n.querySelectorAll(".r").forEach((r) => r.classList.toggle("on", (r.dataset.k === "settings" && t >= at(7, 9.7)) || (r.dataset.k === "ci" && t >= at(7, 10.5))));
  });
  chipAt(OSS, 960, 190, vis(t, at(7, 0.3), at(7, 12.9), 0.5, 0.5), t >= at(7, 10.6) && t < at(7, 12.6));
  put(FORGE, { left: "830px", top: "640px", opacity: tO * span(t, at(7, 2.8), 0.4), visibility: tO > 0 ? "visible" : "hidden" });
  put(START, { left: "750px", top: "420px", opacity: tO * vis(t, at(7, 5.8), at(7, 9.4), 0.4, 0.4), visibility: tO > 0 ? "visible" : "hidden" });
  $("starttyped").textContent = typeOut("npx nikos start", t, at(7, 6.0), 0.6);
  SHAPE.forEach(([n, key, tr, row, side], i) => {
    const o = tO * span(t, at(7, 9.7) + i * 0.8, 0.4);
    const r = tr.getBoundingClientRect();
    put(n, { opacity: o, visibility: o > 0 ? "visible" : "hidden", left: `${r.left}px`, top: `${r.bottom + 24}px` });
  });
  if (tO > 0) { const o = vis(t, at(7, 10.6), at(7, 12.9), 0.3, 0.4); if (o > 0) calls += `<div class="call" style="left:1190px;top:156px;opacity:${o}"><small>The tool itself</small>Fork it. Change it.</div>`; }

  // 7. A company's own view of the plan, at its own address.
  const vo2 = vis(t, at(7, 13.4), at(8, 0.2), 0.3, 0.4);
  if (vo2 > 0) calls += `<div class="call" style="left:1250px;top:770px;opacity:${vo2}"><small>Your own view</small>One HTML file in the company repo</div>`;

  // 8. The whole connection, card by card, grouped by repo.
  const rO = vis(t, at(8, 0), END + 0.9, 0.4, 0.4);
  CARDS.forEach((cd, i) => {
    const o = rO * span(t, cd.from, 0.4);
    const sc = lerp(0.92, 1, back(span(t, cd.from, 0.45)));
    put(cd.node, { opacity: o, visibility: o > 0 ? "visible" : "hidden", transform: `scale(${sc})` });
    put(cd.cap, { opacity: o, visibility: o > 0 ? "visible" : "hidden" });
    if (i > 0 && rO > 0) svg += path(`M${cd.x - 36} 500 L${cd.x - 6} 500`, span(t, cd.from - 0.1, 0.3), rO);
  });
  BRACKETS.forEach(([n, x0, x1, from]) => {
    const o = rO * span(t, from, 0.4);
    put(n, { opacity: o, visibility: o > 0 ? "visible" : "hidden", left: `${(x0 + x1) / 2}px`, top: "636px", transform: "translateX(-50%)" });
    if (o > 0) svg += path(`M${x0 + 4} 604 L${x0 + 4} 614 L${x1 - 4} 614 L${x1 - 4} 604`, span(t, from, 0.5), rO);
  });

  $("ovg").innerHTML = svg;
  $("calls").innerHTML = calls;

  // Close: the end card opens as a circle from the centre.
  const er = std(span(t, END, 0.9));
  put($("end"), { visibility: t >= END ? "visible" : "hidden", clipPath: er >= 1 ? "none" : `circle(${lerp(0, 1200, er)}px at 960px 540px)` });
  [".e0", ".e1", ".e2", ".e3", ".e4"].forEach((sel, i) => { const s0 = END + 0.6 + i * 0.3; put(document.querySelector(sel), { opacity: span(t, s0, 0.4), transform: `translateY(${lerp(14, 0, dec(span(t, s0, 0.5)))}px)` }); });
};
el(`<div id="calls" style="position:absolute;inset:0;z-index:40;pointer-events:none"></div>`);
</script>
</body>
</html>
