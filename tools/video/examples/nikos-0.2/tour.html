<!-- "What if your company's goals lived right next to the work that delivers them?": the nikOS 0.2
     film, made with the product-tour-video skill. Every frame is a pure function of time:
     window.renderAt(seconds) draws it, window.TOTAL is the length. Screens are real captures from

<style>

* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
body { background-color: var(--ground);

.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

/* Windows: real screens, framed. */

.dots { display: flex; gap: 7px; margin-right: 6px; } .dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--line); display: block; }

// ── Time helpers (from the starter) ─────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const span = (t, s, d) => clamp((t - s) / d);
const bezier = (x1, y1, x2, y2) => (x) => {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  let u = x;
  for (let i = 0; i < 8; i++) {
    const bx = 3 * x1 * u * (1 - u) ** 2 + 3 * x2 * u * u * (1 - u) + u ** 3 - x;
    const dx = 3 * x1 * (1 - u) ** 2 + 6 * (x2 - x1) * u * (1 - u) + 3 * (1 - x2) * u * u;
    if (Math.abs(dx) < 1e-6) break;
    u = clamp(u - bx / dx);
  }
  return 3 * y1 * u * (1 - u) ** 2 + 3 * y2 * u * u * (1 - u) + u ** 3;
};
const std = bezier(0.4, 0, 0.2, 1);
const dec = bezier(0, 0, 0.2, 1);
const back = (x) => { x = clamp(x); const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * (x - 1) ** 3 + c1 * (x - 1) ** 2; };
const $ = (id) => document.getElementById(id);
const put = (n, s) => Object.assign(n.style, s);
const typeOut = (text, t, from, dur) => text.slice(0, Math.round(text.length * clamp((t - from) / dur)));
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
// Visible from a to b, fading in and out.
const vis = (t, a, b = 1e9, fi = 0.5, fo = 0.5) => Math.min(span(t, a, fi), 1 - span(t, b - fo, fo));
// Keyframes [t, ...values], eased between.
const along = (K, t) => {
  if (t <= K[0][0]) return K[0].slice(1);
  for (let i = 0; i < K.length - 1; i++) { const [t0, ...a] = K[i], [t1, ...b] = K[i + 1]; if (t < t1) { const p = std(span(t, t0, t1 - t0)); return a.map((v, j) => lerp(v, b[j], p)); } }
  return K[K.length - 1].slice(1);
};
const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return $("stage").appendChild(d.firstChild); };

// ── The timeline: where each voiceover section starts ───────────────────
// vo/s1.mp3 … vo/s8.mp3, laid at these seconds by voice.mjs; times below are those offsets

];

  [4, 0, 3.0, "Before your agents build, define the intent."], [4, 3.1, 4.3, "Who is this for?"], [4, 4.3, 5.7, "What should happen?"], [4, 5.7, 7.4, "What does success look like?"],

  [5, 0, 3.1, "Agents build from the specification."], [5, 3.2, 4.7, "Tests check the behaviour."], [5, 4.7, 8.2, "Pending tests? Not done."],
  [5, 8.3, 10.3, "Human approval stays separate."], [5, 10.3, 14.9, "Change the specification, and the old approval no longer holds."],
  [6, 0, 5.3, "Teams keep their stories and specifications in their own repositories, connected to the company plan."],
  [6, 5.3, 7.2, "Work in parallel."], [6, 7.2, 10.1, "Review delivery alongside goal progress."], [6, 10.1, 13.2, "See when plans need syncing."],
  [7, 0, 4.9, "nikOS is open source, and it runs in the repositories you already use."], [7, 5.0, 8.0, "Start with one team, with nothing new to buy."],

// ── 1. Three things that don't talk to each other ───────────────────────
const TILES = [

const BRAND = el(`<div class="abs" style="left:0;right:0;top:400px;text-align:center"><div style="display:inline-flex;align-items:center;gap:30px">

// ── Real screens ─────────────────────────────────────────────────────────
const WIN = { left: 240, top: 120, w: 1440, h: 800 };

// The planning dashboard (nikos planning serve) and the story map (nikos map), as captured.

const SHOTS = [
  { s: KRS, vis: [at(1, 10.0), at(2, 11.3)], rise: at(1, 10.0),

  { s: ROLL, vis: [at(2, 10.8), at(3, 6.8)],

      let x = typed ? esc(typeOut(html, t, from, 0.6)) : html;
      if (i === EDIT.line && t >= EDIT.from) x += `<span style="color:var(--warn);font-weight:600">${esc(typeOut(EDIT.text, t, EDIT.from + 0.2, 0.6))}</span>`;
      const m = MARKS.filter(([l, a, b]) => l === i && t >= a && t < b).pop();
      const tick = m && (m[3] === "bad" || m[3] === "good") ? `  <span style="color:${m[3] === "good" ? "var(--accent)" : "#D64545"};font-weight:700">${m[3] === "good" ? "✓" : "✗"}</span>` : "";
      return `<div class="ln${m ? ` ${m[3]}` : ""}"><span class="n">${i + 1}</span><span class="x">${x}${tick}</span></div>`;
    }).join("");
    EDCALL.forEach(([l, a, b, text]) => {
      const o = vis(t, a, b, 0.3, 0.4); if (o <= 0) return;
      calls += `<div class="call" style="left:${150 + 900 + lerp(20, 0, dec(span(t, a, 0.4)))}px;top:${160 + 56 + l * 31 - 6}px;opacity:${o * edO}">${text}</div>`;
    });
    const so = vis(t, at(4, 12.2), at(4, 15.6), 0.3, 0.4);
    if (so > 0) calls += `<div class="call" style="left:1070px;top:860px;opacity:${so}"><small>One file in the repo</small>Read by people. Run as tests.</div>`;
    const ao = vis(t, at(5, 8.4), at(5, 10.3), 0.3, 0.4);
    if (ao > 0) calls += `<div class="call" style="left:1070px;top:860px;opacity:${ao}"><small>Approval</small>A person approves, not the agent</div>`;
  }

  // Agent terminal: everything that has started and not been cleared, newest at the bottom.
  const twO = Math.max(vis(t, at(4, 10.2), at(6, 0.3), 0.5, 0.5), vis(t, at(6, 7.0), at(7, 0), 0.5, 0.5));
  put(TW, { opacity: twO, visibility: twO > 0 ? "visible" : "hidden" });
  if (twO > 0) {
    const live = TERM.filter((e) => t >= e[1] && t < e[2]);
    const typing = live.find((e) => e[0] === "you" && t < e[1] + typedFor(e) + 0.25);
    const cwd = [...live].reverse().find((e) => e[5]);
    $("twcwd").textContent = `· ${cwd ? cwd[5] : "tip-calc"}`;
    $("term").innerHTML = live.map((e) => {
      const [kind, from, , text, hl] = e;
      if (kind === "you") return `<div class="l you"><b>›</b>${esc(typeOut(text, t, from, typedFor(e)))}${e === typing ? `<span id="tcaret"></span>` : ""}</div>`;
      if (kind === "ag") { const w = text.split(" "); return `<div class="l ag">${esc(w.slice(0, Math.ceil(w.length * span(t, from, Math.max(0.4, w.length / 14)))).join(" "))}</div>`; }
      if (kind === "cmd") return `<div class="l cmd"><b>$</b> ${esc(text)}</div>`;
      const h = (hl || []).filter(([a]) => t >= a).pop();
      return `<div class="l out${h ? ` ${h[1]}` : ""}">${text || " "}</div>`;
    }).join("");
  }

  // 6. Per-story files, two branches, one merge; the team repo joined to the company's.
  const fO = vis(t, at(6, 0.2), at(7, 0.2), 0.5, 0.5);
  FILES.forEach((f) => {
    const o = fO * span(t, at(6, 0.3) + f.i * 0.25, 0.4);
    put(f.node, { opacity: o, visibility: o > 0 ? "visible" : "hidden", transform: `translateY(${lerp(30, 0, dec(span(t, at(6, 0.3) + f.i * 0.25, 0.5)))}px)` });
    if (o <= 0) return;
    const moved = f.br && t >= at(6, f.br === "a" ? 5.5 : 6.0);
    f.node.querySelector(".body").innerHTML = yk(esc(f.body)).replace("%S%", moved ? `<span class="hv">in_progress</span>` : "todo");
    put(f.node.querySelector(".tag"), { opacity: f.br ? span(t, at(6, f.br === "a" ? 5.4 : 5.9), 0.3) : 0 });
    f.node.classList.toggle("on", !!moved);
  });
  chipAt(TEAMREPO, 355, 215, fO * span(t, at(6, 0.4), 0.4));
  chipAt(COREPO, 805, 215, fO * span(t, at(6, 3.2), 0.4));
  if (fO > 0) svg += path("M512 215 L640 215", span(t, at(6, 3.4), 0.5), fO);
  if (fO > 0) { const o = vis(t, at(6, 3.6), at(6, 7.0), 0.3, 0.4); if (o > 0) calls += `<div class="call" style="left:470px;top:110px;opacity:${o}"><small>nikos join</small>Connected to the company plan</div>`; }
  put(MERGED, { left: "150px", top: "750px", opacity: fO * vis(t, at(6, 6.4), at(7, 0.2), 0.4, 0.5), visibility: fO > 0 ? "visible" : "hidden" });

  // 7. The real files, labelled.
  const tO = vis(t, at(7, 1.8), at(8, 0.2), 0.5, 0.5);
  [T1, T2].forEach((n, i) => {
    const o = tO * span(t, at(7, 1.9) + i * 0.3, 0.4);
    put(n, { opacity: o, visibility: o > 0 ? "visible" : "hidden" });
    n.querySelectorAll(".r").forEach((r) => r.classList.toggle("on", (r.dataset.k === "settings" && t >= at(7, 8.3)) || (r.dataset.k === "ci" && t >= at(7, 9.1))));
  });
  chipAt(OSS, 960, 190, vis(t, at(7, 0.3), at(8, 0.2), 0.5, 0.5), t >= at(7, 9.8) && t < at(8, 0));
  put(FORGE, { left: "830px", top: "640px", opacity: tO * span(t, at(7, 2.8), 0.4), visibility: tO > 0 ? "visible" : "hidden" });
  put(START, { left: "750px", top: "420px", opacity: tO * vis(t, at(7, 4.9), at(7, 8.2), 0.4, 0.4), visibility: tO > 0 ? "visible" : "hidden" });
  $("starttyped").textContent = typeOut("npx nikos start", t, at(7, 5.1), 0.6);
  SHAPE.forEach(([n, key, tr, row, side], i) => {
    const o = tO * span(t, at(7, 8.3) + i * 0.8, 0.4);
    const r = tr.getBoundingClientRect();
    put(n, { opacity: o, visibility: o > 0 ? "visible" : "hidden", left: `${r.left}px`, top: `${r.bottom + 24}px` });
  });
  if (tO > 0) { const o = vis(t, at(7, 9.8), at(8, 0.2), 0.3, 0.4); if (o > 0) calls += `<div class="call" style="left:1190px;top:156px;opacity:${o}"><small>The tool itself</small>Fork it. Change it.</div>`; }

  // 8. The whole connection, card by card, grouped by repo.
  const rO = vis(t, at(8, 0), END + 0.9, 0.4, 0.4);
  CARDS.forEach((cd, i) => {
    const o = rO * span(t, cd.from, 0.4);
    const sc = lerp(0.92, 1, back(span(t, cd.from, 0.45)));
    put(cd.node, { opacity: o, visibility: o > 0 ? "visible" : "hidden", transform: `scale(${sc})` });
    put(cd.cap, { opacity: o, visibility: o > 0 ? "visible" : "hidden" });
    if (i > 0 && rO > 0) svg += path(`M${cd.x - 56} 508 L${cd.x - 8} 508`, span(t, cd.from - 0.1, 0.3), rO);
  });
  BRACKETS.forEach(([n, x0, x1, from]) => {
    const o = rO * span(t, from, 0.4);
    put(n, { opacity: o, visibility: o > 0 ? "visible" : "hidden", left: `${(x0 + x1) / 2}px`, top: "650px", transform: "translateX(-50%)" });
    if (o > 0) svg += path(`M${x0} 626 L${x0} 636 L${x1} 636 L${x1} 626`, span(t, from, 0.5), rO);
  });

  $("ovg").innerHTML = svg;
  $("calls").innerHTML = calls;

  // Close: the end card opens as a circle from the centre.
  const er = std(span(t, END, 0.9));
  put($("end"), { visibility: t >= END ? "visible" : "hidden", clipPath: er >= 1 ? "none" : `circle(${lerp(0, 1200, er)}px at 960px 540px)` });
  [".e0", ".e1", ".e2", ".e3", ".e4"].forEach((sel, i) => { const s0 = END + 0.6 + i * 0.3; put(document.querySelector(sel), { opacity: span(t, s0, 0.4), transform: `translateY(${lerp(14, 0, dec(span(t, s0, 0.5)))}px)` }); });
};
el(`<div id="calls" style="position:absolute;inset:0;z-index:40;pointer-events:none"></div>`);
</script>
</body>
</html>
