name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # behave runs the Python fixture in test/verify.test.ts.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install behave
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:ci
      - name: Upload JUnit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-node-${{ matrix.node }}
          path: reports/junit.xml
          if-no-files-found: error
      - name: Publish test report
        # Fork PRs get a read-only token, so only publish the check for same-repo runs.
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/junit.xml
          check_name: Tests (Node ${{ matrix.node }})
      - name: Report test results to IntentDocs
        # Set up by `npx intentdocs ci`. Report once per run, and only where the secret is available.
        if: ${{ !cancelled() && matrix.node == 22 && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        continue-on-error: true
        env:
          INTENTDOCS_CI_KEY: ${{ secrets.INTENTDOCS_CI_KEY }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          curl -sS --fail-with-body -X POST "https://www.intentdocs.com/api/ci/43dbe934-a30d-45fa-8f69-3f33f7870842/report" \
            -H "Authorization: Bearer $INTENTDOCS_CI_KEY" \
            -H "X-Commit-SHA: $COMMIT_SHA" \
            -H "X-Branch: $BRANCH" \
            -H "Content-Type: application/xml" \
            --data-binary @reports/junit.xml
