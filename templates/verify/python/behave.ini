# Created by `nikos verify setup`. Runs the stories in each map's features folder as tests.
# behave takes folders, not globs, and fails on a folder that doesn't exist, so setup lists one
# folder per map that has features: a multi-line paths = with each folder on its own indented line.
# Step definitions live in steps/ at the repo root.
[behave]
paths = maps/<key>/features
